[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calorie-model"
version = "0.1.0"
description = "Lightweight on-device model: food image -> calories, mass and macros"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.optional-dependencies]
export = ["onnx", "onnxruntime"]
dev = ["pytest", "onnx", "onnxruntime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
